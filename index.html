<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asistencia</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#102a2b;background:#f3f7f6}*{box-sizing:border-box}body{margin:0;min-height:100vh}.app{max-width:650px;margin:auto;padding:35px 20px}header{padding:6px 4px 24px}.eyebrow{margin:0 0 8px;color:#0f766e;font-weight:700;font-size:.75rem;letter-spacing:.09em}h1{margin:0 0 16px;font-size:3rem;letter-spacing:-.05em}.counter{display:inline-block;padding:12px 16px;background:#d9f7ed;color:#146243;border-radius:14px;font-weight:650}#presentCount{font-size:1.2rem}.empty{text-align:center;padding:50px 16px;background:#fff;border-radius:22px;box-shadow:0 5px 28px #163c3210}.empty-icon{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 18px;border-radius:50%;background:#d9f7ed;color:#087f5b;font-size:2rem;font-weight:bold}.empty p,dialog p{color:#52706d;margin-bottom:26px}button{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:650;cursor:pointer}.primary{color:#fff;background:#0f766e}.secondary{color:#175d59;background:#e3f1ef}.link-button{color:#a33f36;background:transparent}.actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}ul{list-style:none;padding:0;margin:0;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 5px 28px #163c3210}li+li{border-top:1px solid #e7eeee}.person{width:100%;display:flex;gap:14px;align-items:center;text-align:left;padding:17px 18px;background:#fff;color:#102a2b;border-radius:0}.mark{display:grid;place-items:center;flex:0 0 26px;width:26px;height:26px;border:2px solid #b8c9c7;border-radius:50%;color:transparent}.present .mark{border-color:#119567;color:#fff;background:#119567}.status{margin-left:auto;color:#6c8481;font-size:.85rem}.present .status{color:#087f5b}dialog{width:min(92vw,540px);padding:0;border:0;border-radius:20px;box-shadow:0 15px 70px #0004}dialog::backdrop{background:#0d292466}dialog form{padding:24px}textarea{width:100%;min-height:250px;padding:14px;resize:vertical;border:1px solid #b8c9c7;border-radius:12px;font:inherit}.dialog-actions{display:flex;justify-content:end;gap:10px;margin-top:16px}
</style></head><body><main class="app"><header><p class="eyebrow">CONTROL DE ASISTENCIA</p><h1>Asistencia</h1><div class="counter"><span id="presentCount">0</span> presentes de <span id="totalCount">0</span></div></header><section id="emptyState" class="empty"><div class="empty-icon">✓</div><h2>Tu lista está vacía</h2><p>Pega los nombres para comenzar a tomar asistencia.</p><button id="openImportEmpty" class="primary">Añadir nombres</button></section><section id="listSection" hidden><div class="actions"><button id="openImport" class="secondary">Cambiar lista</button><button id="resetAttendance" class="link-button">Reiniciar asistencia</button></div><ul id="peopleList"></ul></section></main><dialog id="importDialog"><form method="dialog"><h2>Importar lista</h2><p>Escribe o pega un nombre por línea.</p><textarea id="namesInput" placeholder="Ana García&#10;Bruno López&#10;Carla Pérez" autofocus></textarea><div class="dialog-actions"><button value="cancel" class="secondary">Cancelar</button><button id="saveNames" value="default" class="primary">Guardar lista</button></div></form></dialog>
<script>
const key='asistencia-personas-v1', $=s=>document.querySelector(s);let people=JSON.parse(localStorage.getItem(key)||'[]');const dialog=$('#importDialog'),input=$('#namesInput');function save(){localStorage.setItem(key,JSON.stringify(people))}function safe(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}function render(){const present=people.filter(p=>p.present).length;$('#presentCount').textContent=present;$('#totalCount').textContent=people.length;$('#emptyState').hidden=people.length>0;$('#listSection').hidden=!people.length;$('#peopleList').innerHTML='';people.forEach((p,i)=>{const li=document.createElement('li'),b=document.createElement('button');b.className='person'+(p.present?' present':'');b.innerHTML=`<span class="mark">✓</span><span>${safe(p.name)}</span><span class="status">${p.present?'Presente':'Ausente'}</span>`;b.onclick=()=>{people[i].present=!people[i].present;save();render()};li.append(b);$('#peopleList').append(li)})}function openImport(){input.value=people.map(p=>p.name).join('\n');dialog.showModal()}$('#openImport').onclick=openImport;$('#openImportEmpty').onclick=openImport;$('#saveNames').onclick=e=>{const names=input.value.split(/\r?\n/).map(n=>n.trim()).filter(Boolean);if(!names.length){e.preventDefault();input.focus();return}people=names.map(name=>({name,present:false}));save();render()};$('#resetAttendance').onclick=()=>{if(confirm('¿Marcar a todas las personas como ausentes?')){people.forEach(p=>p.present=false);save();render()}};render();
</script></body></html>
